[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "framebridge"
version = "0.2.0"
description = "Framebridge: an unofficial Frame.io V4 CLI with browser session authentication"
requires-python = ">=3.10"
dependencies = ["requests>=2.32,<3", "python-dotenv>=1,<2"]

[project.scripts]
framebridge = "framebridge.cli:main"

[tool.setuptools.packages.find]
include = ["framebridge*"]

[tool.setuptools.package-data]
framebridge = ["browser_login.mjs"]
